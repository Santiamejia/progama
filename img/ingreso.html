<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio sesión</title>
    <link rel="stylesheet" href="../css/ingreso.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">
</head>
<div>
    <a class="volver"href="index.html">Volver</a>
</div>
    <body class="body-inicio-sesion">
        <div class="ingreso">
            <img class="logo"src="../img/Troya.png" alt="Logo Troya">
            <h1 class="titulo-inicio-sesion">Inicia sesión en Troya</h1>

            <div class="cuadro-inicio-sesion">
                <form class="formulario-ingreso" id="formulario-ingreso">
                    <div>
                        <label for="Correo electrónico">Correo electrónico</label>
                        <input type="email" id="correo-electrónico" name="correo electrónico" required>
                    </div>
                    <div>
                        <label for="Contraseña">Contraseña</label> 
                        <input type="password" id="Contraseña" name="Contraseña" required>
                    </div>
                
                    <button type="submit">Iniciar sesión</button>
                    
                    <a class="restaurar-contraseña" href="restaurar-contraseña.html">¿Olvidaste tu contraseña?</a>
                    <button type="button">Inicia sesión con Google</button>
                    <a class="crear-cuenta" href="registro.html">Crear cuenta nueva</a>
                
                </form>
            </div>
        </div>

    </body>
</html>
