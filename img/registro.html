    <body class="body-registro">
        <div class="contenedor-registro">
            <img class="logo"src="../img/Troya.png" alt="Logo Troya">
            <h1 class="titulo-registro">Formulario de registro</h1>        
        
            <div class="cuadro-registro">
            <form class="registro-formulario" id="registro-formulario" action="registro.php" method="POST">
                <div class="fila-doble">
                    <div><label for="nombres">Nombres</label>
                        <input type="text" id="nombres" name="nombres" required></div>
                    <div><label for="apellidos">Apellidos</label> 
                        <input type="text" id="apellidos" name="apellidos" required></div>
                </div>
                <div class="fila-doble">
                    <div><label for="fecha_nacimiento">Fecha de nacimiento</label> 
                        <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required></div>
                    <div><label for="correo">Correo electrónico</label> 
                        <input type="email" id="correo" name="correo" required></div>
                </div>
                <div class="fila-doble">
                    <div><label for="password">Contraseña</label> 
                        <input type="password" id="password" name="password" required></div>
                </div>
                    <div><button type="submit">Crear cuenta</button>
                </div>
                
            </form>
            <a class="inicio-sesion" href="ingreso.html">Si ya tiene cuenta, inicia sesión</a>
            </div>
        </div>
    </body>
